<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden flex flex-col md:flex-row">
<!-- Left Split: Branding & Visuals (Hidden on mobile) -->
<div class="hidden md:flex md:w-1/2 relative bg-surface-container-low flex-col justify-between p-margin-desktop overflow-hidden border-r border-outline-variant/30">
<!-- Abstract Background Decoration -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] rounded-full bg-primary-fixed opacity-30 blur-3xl mix-blend-multiply"></div>
<div class="absolute top-[40%] -right-[20%] w-[60%] h-[60%] rounded-full bg-secondary-fixed opacity-30 blur-3xl mix-blend-multiply"></div>
</div>
<!-- Logo Area -->
<div class="relative z-10 flex items-center gap-3">
<img alt="PeopleOS Logo" class="w-10 h-10 rounded-md shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDO7DJRgzg6xKy_4iYo5AwtTO-8j5ihRCVhQYqykveN-jb7xm9vHESIhyTwWTZvoKQH00IozV7cP8h8L-ymgN5wGdTCNxphRyOC8oWwckiHYZ5E1gsVNQ8iYRsYY2-O_ZdbrGug-XFE5R55J1drZR_TnQPfJUDrtrmzPrllqzvFvsKTNuPpBQyJa2OVeuZ68amtQGpVcTofItHdiZIAmNLKS7zN1z0MBlfzew0qnkAmxBwWMWSGC9G1"/>
<span class="font-headline-section text-headline-section font-bold text-primary">PeopleOS</span>
</div>
<!-- Hero Content -->
<div class="relative z-10 max-w-md mt-auto mb-16">
<h1 class="font-headline-page text-headline-page text-on-surface mb-4">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to manage your employee workspace. Intelligent HR operations for modern teams.</p>
</div>
<!-- Mock Dashboard Visual (Glassmorphism) -->
<div class="relative z-10 w-[120%] -ml-[5%] glass-panel rounded-xl shadow-lg border border-outline-variant/20 p-6 flex flex-col gap-4 transform translate-y-8 rotate-[-1deg] transition-transform hover:rotate-0 duration-500">
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm">groups</span>
</div>
<div>
<div class="h-4 w-24 bg-surface-variant rounded-full mb-1"></div>
<div class="h-3 w-16 bg-surface-container-high rounded-full"></div>
</div>
</div>
<div class="h-6 w-16 bg-surface-container-highest rounded-md"></div>
</div>
<!-- Mock Chart Lines -->
<div class="flex gap-2 items-end h-24 mt-4">
<div class="w-1/6 bg-primary-fixed-dim rounded-t-sm h-[40%]"></div>
<div class="w-1/6 bg-primary-fixed-dim rounded-t-sm h-[60%]"></div>
<div class="w-1/6 bg-primary-fixed-dim rounded-t-sm h-[30%]"></div>
<div class="w-1/6 bg-primary-fixed-dim rounded-t-sm h-[80%]"></div>
<div class="w-1/6 bg-primary-container rounded-t-sm h-[100%] shadow-sm"></div>
<div class="w-1/6 bg-primary-fixed-dim rounded-t-sm h-[70%]"></div>
</div>
</div>
</div>
<!-- Right Split: Login Form -->
<div class="w-full md:w-1/2 h-full flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop bg-surface-container-lowest">
<div class="w-full max-w-[400px]">
<!-- Mobile Logo (Visible only on small screens) -->
<div class="md:hidden flex items-center justify-center gap-3 mb-8">
<img alt="PeopleOS Logo" class="w-12 h-12 rounded-md shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDO7DJRgzg6xKy_4iYo5AwtTO-8j5ihRCVhQYqykveN-jb7xm9vHESIhyTwWTZvoKQH00IozV7cP8h8L-ymgN5wGdTCNxphRyOC8oWwckiHYZ5E1gsVNQ8iYRsYY2-O_ZdbrGug-XFE5R55J1drZR_TnQPfJUDrtrmzPrllqzvFvsKTNuPpBQyJa2OVeuZ68amtQGpVcTofItHdiZIAmNLKS7zN1z0MBlfzew0qnkAmxBwWMWSGC9G1"/>
<span class="font-headline-section text-headline-section font-bold text-primary">PeopleOS</span>
</div>
<div class="text-center md:text-left mb-8">
<h2 class="font-headline-page text-headline-page text-on-surface mb-2">Sign In</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your credentials to access your account.</p>
</div>
<form class="flex flex-col gap-6">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-12 pr-4 py-3 text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-outline/50" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-12 pr-12 py-3 text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 transform -translate-y-1/2 text-outline hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Submit -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border border-outline-variant rounded bg-surface-bright checked:bg-primary checked:border-primary focus:outline-none focus:ring-2 focus:ring-primary/50 transition-colors" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-body-md font-semibold py-3 px-4 rounded-lg shadow-sm transition-all active:scale-[0.98] flex justify-center items-center gap-2" type="submit">
                    Sign in
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center py-6">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-outline">or continue with</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<!-- OAuth Options -->
<div class="flex flex-col gap-4">
<button class="w-full bg-surface-bright hover:bg-surface-container border border-outline-variant/50 text-on-surface font-body-md py-3 px-4 rounded-lg shadow-sm transition-all active:scale-[0.98] flex justify-center items-center gap-3" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Sign in with Google
                </button>
</div>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-8">
                Don't have an account? 
                <a class="font-semibold text-primary hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
